services:
  - type: web
    name: financial-nlp-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m nltk.downloader -d /opt/render/project/src/nltk_data punkt punkt_tab
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AIRTABLE_API_TOKEN
        sync: false
      - key: NLTK_DATA
        value: /opt/render/project/src/nltk_data
