services:
  - type: web
    name: financial-nlp-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m nltk.downloader punkt punkt_tab
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AIRTABLE_API_TOKEN
        sync: false
